user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # 使用 Docker 內部 DNS 解析器，延遲解析上游服務直到請求到來
    # 避免啟動時因上游容器未就緒而導致 nginx 啟動失敗
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 經 Cloudflare Tunnel 進來時，真實 client IP 在 CF-Connecting-IP；
    # 直接內網存取時該 header 為空，退回 $remote_addr。
    # 後端 rate limit（login/forgot-password/AI）依 req.ip 計算，
    # 若不處理會讓所有外部使用者共用 cloudflared 容器的同一個 IP。
    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    # 經 Cloudflare Tunnel 進來時，nginx 本身只聽 80，$scheme 永遠是 http；
    # 真實協定在 CF-Visitor header（JSON，例如 {"scheme":"https"}）。
    # 轉成 X-Forwarded-Proto 後，後端 req.protocol / req.secure 才會正確判斷 https。
    # 直接內網 http 存取時該 header 為空，退回 $scheme。
    map $http_cf_visitor $client_scheme {
        default              $scheme;
        '~"scheme":"https"'  https;
    }

    server {
        listen 80;
        server_name science.wuretedu.com localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            set $front http://front:5173;
            proxy_pass $front;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
        }

        client_max_body_size 100M;

        location /api/ {
            set $api http://api:3000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
            # 檔案上傳可能耗時較久，避免 Nginx 預設 60 秒斷線
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            client_body_timeout 300;
        }

        location /socket.io/ {
            set $api http://api:3000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location /proxy/api/ {
            set $api http://api:3000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /proxy/next-chat/ {
            set $api http://api:3000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
