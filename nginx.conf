user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # 不在回應標頭與錯誤頁洩漏 nginx 版本
    server_tokens off;

    # 區網使用者不經 Cloudflare，沒有邊緣壓縮；這裡自己壓 JS/CSS/JSON/SVG。
    # gzip_proxied any：經 Cloudflare Tunnel 進來的請求帶 Via header，仍要壓縮。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # 使用 Docker 內部 DNS 解析器，延遲解析上游服務直到請求到來
    # 避免啟動時因上游容器未就緒而導致 nginx 啟動失敗
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 經 Cloudflare Tunnel 進來時，真實 client IP 在 CF-Connecting-IP；
    # 直接內網存取時該 header 為空，退回 $remote_addr。
    # 後端 rate limit（login/forgot-password/AI）依 req.ip 計算，
    # 若不處理會讓所有外部使用者共用 cloudflared 容器的同一個 IP。
    map $http_cf_connecting_ip $client_ip {
        ""      $remote_addr;
        default $http_cf_connecting_ip;
    }

    # 經 Cloudflare Tunnel 進來時，nginx 本身只聽 80，$scheme 永遠是 http；
    # 真實協定在 CF-Visitor header（JSON，例如 {"scheme":"https"}）。
    # 轉成 X-Forwarded-Proto 後，後端 req.protocol / req.secure 才會正確判斷 https。
    # 直接內網 http 存取時該 header 為空，退回 $scheme。
    map $http_cf_visitor $client_scheme {
        default              $scheme;
        '~"scheme":"https"'  https;
    }

    # 前端頁面的 CSP（目前 Report-Only，只回報不阻擋）。用 map 當常數，避免在多個 location 重複長字串。
    # 已知：html2pdf / socket.io / recharts / vis-network 打包後含 Function("return this") 全域偵測，
    # 正式強制前要先看 /api/csp-report 的回報決定是否需要 'unsafe-eval'（future-list F023）。
    map $host $csp_report_only {
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/csp-report";
    }

    server {
        listen 80;
        server_name science.wuretedu.com localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        # Vite 建構產物：檔名帶 content hash，內容改變檔名就變，可放心永久快取。
        # 對應 performance/PERFORMANCE_CHECKLIST.md 的 max-age=31536000, immutable。
        location ^~ /assets/ {
            set $front http://front:5173;
            proxy_pass $front;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # public/ 下沒有 hash 的靜態圖片、字型、favicon：快取一天，部署換檔名即可立即生效
        location ~* \.(png|jpe?g|webp|gif|ico|svg|woff2?|ttf|otf)$ {
            set $front http://front:5173;
            proxy_pass $front;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }

        # SPA 入口與其餘路由：index.html 不快取，確保每次部署後拿到新的 asset 清單
        location / {
            set $front http://front:5173;
            proxy_pass $front;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache";
            # 安全標頭（2026-09-05 資安審查）。nginx 的 add_header 不會從 server 層繼承到已有 add_header 的 location，
            # 所以每個前端 location 都要自己列一次。/api、/socket.io、/proxy 由後端 helmet 負責，這裡不重複加。
            # HSTS 只在 https 時被瀏覽器採用，區網 http 直連會忽略，不影響。
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            # CSP 先用 Report-Only 收集違規（POST /api/csp-report 寫日誌），轉正式強制見 future-list F023
            add_header Content-Security-Policy-Report-Only $csp_report_only always;
        }

        client_max_body_size 100M;

        location ^~ /api/ {
            set $api http://api:3000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
            # 檔案下載改成 streaming 後，關閉 buffering 讓大檔邊讀邊送，不在 nginx 落地暫存
            proxy_buffering off;
            # 檔案上傳可能耗時較久，避免 Nginx 預設 60 秒斷線
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            client_body_timeout 300;
        }

        location ^~ /socket.io/ {
            set $api http://api:3000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        location ^~ /proxy/api/ {
            set $api http://api:3000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location ^~ /proxy/next-chat/ {
            set $api http://api:3000;
            proxy_pass $api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $client_scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
