name: Deploy to Production

on:
  push:
    branches:
      - rwd-layout-clean

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: 🏗️ Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./sdl-backend-main
          file: ./sdl-backend-main/Dockerfile.prod
          push: true
          tags: stone881129/sdl-api:sdls-v3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🎨 Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./sdl-frontend-main
          file: ./sdl-frontend-main/Dockerfile.prod
          push: true
          tags: stone881129/sdl-front:sdls-v3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          command_timeout: 300s
          script: |
            # 定義部署目標
            DEPLOY_TARGETS=(
              "/home/hsueh/SDLs_fullStack_remix_v3|docker-compose.v3.yml|main"
              "/home/hsueh/SDLs_fullStack_remix_v3_lazyinwork|docker-compose.yml|lazyinwork"
            )

            # 全域拉取映像檔一次即可
            echo "📦 拉取最新映像檔..."
            docker pull stone881129/sdl-api:sdls-v3
            docker pull stone881129/sdl-front:sdls-v3

            # 遍歷部署目標
            for target in "${DEPLOY_TARGETS[@]}"; do
              IFS='|' read -r deploy_dir compose_file service_name <<< "$target"
              
              echo "🎯 部署 $service_name 到 $deploy_dir"
              cd "$deploy_dir" || { echo "❌ 目錄 $deploy_dir 不存在"; exit 1; }

              # 備份 .env
              if [ -f .env ]; then
                cp .env .env.backup
                echo "✅ 已備份 $service_name .env 檔案"
              fi

              # 停止舊服務
              echo "🛑 停止 $service_name 舊服務..."
              docker-compose -f "$compose_file" down || true

              # 啟動新服務
              echo "🚀 啟動 $service_name 新服務..."
              docker-compose -f "$compose_file" up -d

              # 等待啟動
              echo "⏳ 等待 $service_name 服務啟動..."
              sleep 30

              # 執行 migration
              echo "🧬 執行 $service_name Sequelize migration..."
              docker-compose -f "$compose_file" exec -T api npx sequelize-cli db:migrate || { 
                echo "❌ $service_name Migration 失敗"; 
                exit 1; 
              }

              echo "✅ $service_name 部署完成！"
            done

            # 統一清理映像檔
            echo "🧹 清理舊映像檔..."
            docker image prune -f

      - name: 🎯 Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          command_timeout: 180s
          script: |
            # 驗證部署目標 (復用相同數據結構)
            VERIFY_TARGETS=(
              "/home/hsueh/SDLs_fullStack_remix_v3|docker-compose.v3.yml|main"
              "/home/hsueh/SDLs_fullStack_remix_v3_lazyinwork|docker-compose.yml|lazyinwork"
            )

            # 遍歷驗證每個服務
            for target in "${VERIFY_TARGETS[@]}"; do
              IFS='|' read -r deploy_dir compose_file service_name <<< "$target"
              
              echo "🔍 驗證 $service_name 部署狀態..."
              cd "$deploy_dir" || { echo "❌ 無法進入 $deploy_dir"; exit 1; }

              docker-compose -f "$compose_file" ps

              INVALID=$(docker-compose -f "$compose_file" ps | awk 'NR>1 && $0 !~ /Up/ {print $1, $5}')

              if [ -n "$INVALID" ]; then
                echo "❌ $service_name 以下容器未正常運行："
                echo "$INVALID"
                docker-compose -f "$compose_file" logs --tail=100
                exit 1
              else
                echo "✅ $service_name 所有容器皆正常運行"
              fi
            done