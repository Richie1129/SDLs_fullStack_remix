name: Deploy to Production

on:
  push:
    branches:
      - master

# 併發控制：同一分支同時只允許一個部署流程執行
# cancel-in-progress: false → 排隊等待，不中斷進行中的 migration/部署
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
  # 動態映像標籤：使用 Git commit SHA 作為唯一版號
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ────────────────────────────────────────────────────────────────
  # Job 1：建構並推送 Docker 映像檔
  # ────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: 🏗️ Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./sdl-backend-main
          file: ./sdl-backend-main/Dockerfile.prod
          push: true
          # 雙標籤：精確 SHA 版本 + sdls-v3 備用/最新標籤
          tags: |
            stone881129/sdl-api:${{ env.IMAGE_TAG }}
            stone881129/sdl-api:sdls-v3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🎨 Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./sdl-frontend-main
          file: ./sdl-frontend-main/Dockerfile.prod
          push: true
          # 雙標籤：精確 SHA 版本 + sdls-v3 備用/最新標籤
          tags: |
            stone881129/sdl-front:${{ env.IMAGE_TAG }}
            stone881129/sdl-front:sdls-v3
          # 傳入 VITE_* 建構時變數（不在 .env 中，需透過 Secrets 傳入）
          build-args: |
            VITE_RAGFLOW_CHAT_ID=${{ secrets.VITE_RAGFLOW_CHAT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────
  # Job 2：SSH 進伺服器部署（依賴 build 成功才執行）
  # ────────────────────────────────────────────────────────────────
  deploy:
    # self-hosted runner 架在目標伺服器同區網，才能連到內網 IP
    runs-on: self-hosted
    needs: build

    steps:
      - name: 🚀 Deploy to server
        # 釘選 composite 版本：self-hosted runner 不需 docker build action 映像
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          command_timeout: 300s
          # 將 IMAGE_TAG 傳入 SSH 環境，腳本直接以 $NEW_TAG 使用
          envs: IMAGE_TAG
          script: |
            NEW_TAG="${IMAGE_TAG}"

            # 定義部署目標
            DEPLOY_TARGETS=(
              "/home/richie/SDLs_fullStack_remix|docker-compose.yml|sdl"
            )

            # ── 全域拉取精確版本映像檔 ──────────────────────────────
            echo "📦 全域拉取映像檔 (tag: ${NEW_TAG})..."
            docker pull stone881129/sdl-api:${NEW_TAG}
            docker pull stone881129/sdl-front:${NEW_TAG}

            # 遍歷部署目標
            for target in "${DEPLOY_TARGETS[@]}"; do
              IFS='|' read -r deploy_dir compose_file service_name <<< "$target"

              echo "🎯 部署 $service_name 到 $deploy_dir"
              cd "$deploy_dir" || { echo "❌ 目錄 $deploy_dir 不存在"; exit 1; }

              # 備份 .env
              if [ -f .env ]; then
                cp .env .env.backup
                echo "✅ 已備份 $service_name .env 檔案"
              fi

              # 將 IMAGE_TAG 寫入 .env（有則更新，無則新增），並確保不會黏到上一行
              if grep -q "^IMAGE_TAG=" .env 2>/dev/null; then
                sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${NEW_TAG}|" .env
              else
                if [ -s .env ] && [ "$(tail -c 1 .env 2>/dev/null || true)" != "" ]; then
                  printf '\n' >> .env
                fi
                printf 'IMAGE_TAG=%s\n' "$NEW_TAG" >> .env
              fi
              echo "✅ .env IMAGE_TAG 已更新為 ${NEW_TAG}"

              # 只拉取 api 和 front 映像，不動 postgres/minio 避免觸發重建
              echo "🔄 同步 $service_name Compose 映像 (api + front)..."
              docker compose -f "$compose_file" pull api front

              # ── Migration 安全防護 ──────────────────────────────────
              # --no-deps：不啟動/重建依賴服務，postgres 已在運行中
              # 容器仍會加入 compose 定義的網路，可連到 postgres
              echo "🧬 執行 $service_name Sequelize migration（臨時容器）..."
              # 確保 postgres 已啟動，再取得容器 ID
              docker compose -f "$compose_file" up -d postgres > /dev/null
              POSTGRES_CONTAINER_ID=$(docker compose -f "$compose_file" ps -q postgres | head -1)
              if [ -z "$POSTGRES_CONTAINER_ID" ]; then
                echo "❌ 找不到 postgres 容器，無法執行 migration"
                docker compose -f "$compose_file" ps
                exit 1
              fi

              # 等待 postgres 進入穩定狀態（running/healthy）
              echo "⏳ 等待 postgres 容器穩定啟動..."
              READY=false
              for i in $(seq 1 30); do
                STATUS=$(docker inspect "$POSTGRES_CONTAINER_ID" --format '{{.State.Status}}' 2>/dev/null || echo "unknown")
                HEALTH=$(docker inspect "$POSTGRES_CONTAINER_ID" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null || echo "unknown")

                # 無 healthcheck: 只要 running 即可；有 healthcheck: 需 healthy
                if [ "$STATUS" = "running" ] && { [ "$HEALTH" = "healthy" ] || [ "$HEALTH" = "none" ]; }; then
                  READY=true
                  echo "✅ postgres 已就緒 (status=$STATUS, health=$HEALTH)"
                  break
                fi

                if [ "$STATUS" = "exited" ] || [ "$STATUS" = "dead" ]; then
                  echo "❌ postgres 非正常狀態 (status=$STATUS, health=$HEALTH)"
                  break
                fi

                echo "...等待中 (attempt $i/30, status=$STATUS, health=$HEALTH)"
                sleep 2
              done

              if [ "$READY" != "true" ]; then
                echo "❌ postgres 未能在時間內穩定啟動"
                docker compose -f "$compose_file" ps
                docker compose -f "$compose_file" logs --tail=80 postgres
                exit 1
              fi

              echo "🔗 共用 postgres 網路命名空間: ${POSTGRES_CONTAINER_ID}"
              # 傳入 .env 及必要覆蓋值，確保臨時容器能讀到正確 DB 連線資訊
              # 注意：舊版 docker-compose run 不支援 --network，改用 docker run 直接啟動
              # 使用 --network container:<postgres_id> 避免 DNS/IP 解析問題
              docker run --rm --network "container:${POSTGRES_CONTAINER_ID}" \
                --env-file .env \
                -e PG_HOST=127.0.0.1 \
                -e PG_PORT=5432 \
                -e NODE_ENV=production \
                stone881129/sdl-api:${NEW_TAG} npx sequelize-cli db:migrate || {
                echo "❌ $service_name Migration 失敗，中止部署以保護線上服務"
                exit 1
              }
              echo "✅ $service_name Migration 成功"

              # ── Seed：匯入學校名單（upsert，可重複執行）─────────────
              echo "🏫 執行 $service_name 學校名單 Seed..."
              docker run --rm \
                --network "container:${POSTGRES_CONTAINER_ID}" \
                --env-file .env \
                -e PG_HOST=127.0.0.1 \
                -e PG_PORT=5432 \
                -e NODE_ENV=production \
                "stone881129/sdl-api:${NEW_TAG}" node scripts/seedSchools.js || {
                echo "⚠️ Seed 失敗（非致命，繼續部署）"
              }
              echo "✅ $service_name Seed 完成"
              # ────────────────────────────────────────────────────────

              # 無停機替換：直接 up -d，Docker 自動重啟變更的容器
              echo "🚀 啟動 $service_name 新服務（零停機替換）..."
              docker compose -f "$compose_file" up -d

              echo "✅ $service_name 部署完成！"
            done

            # 統一清理舊映像檔
            echo "🧹 清理舊映像檔..."
            docker image prune -f

  # ────────────────────────────────────────────────────────────────
  # Job 3：驗證部署結果（依賴 deploy 成功才執行）
  # ────────────────────────────────────────────────────────────────
  verify:
    runs-on: self-hosted
    needs: deploy

    steps:
      - name: 🎯 Verify deployment
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          command_timeout: 180s
          envs: IMAGE_TAG
          script: |
            NEW_TAG="${IMAGE_TAG}"

            # 驗證部署目標 (復用相同數據結構)
            VERIFY_TARGETS=(
              "/home/richie/SDLs_fullStack_remix|docker-compose.yml|sdl"
            )

            # 遍歷驗證每個服務
            for target in "${VERIFY_TARGETS[@]}"; do
              IFS='|' read -r deploy_dir compose_file service_name <<< "$target"

              echo "⏳ 等待 10 秒讓 $service_name 容器穩定啟動..."
              sleep 10

              echo "🔍 驗證 $service_name 部署狀態..."
              cd "$deploy_dir" || { echo "❌ 無法進入 $deploy_dir"; exit 1; }

              if ! grep -q "^IMAGE_TAG=${NEW_TAG}$" .env; then
                echo "❌ $service_name .env 的 IMAGE_TAG 不是預期值 ${NEW_TAG}"
                grep '^IMAGE_TAG=' .env || true
                exit 1
              fi

              docker compose -f "$compose_file" ps

              INVALID=$(docker compose -f "$compose_file" ps | awk 'NR>1 && $0 !~ /Up/ {print $1, $5}')

              if [ -n "$INVALID" ]; then
                echo "❌ $service_name 以下容器未正常運行："
                echo "$INVALID"
                docker compose -f "$compose_file" logs --tail=100
                exit 1
              else
                echo "✅ $service_name 所有容器皆正常運行"
              fi

              API_CONTAINER_ID=$(docker compose -f "$compose_file" ps -q api | head -1)
              FRONT_CONTAINER_ID=$(docker compose -f "$compose_file" ps -q front | head -1)
              POSTGRES_CONTAINER_ID=$(docker compose -f "$compose_file" ps -q postgres | head -1)

              API_IMAGE=$(docker inspect "$API_CONTAINER_ID" --format '{{.Config.Image}}')
              FRONT_IMAGE=$(docker inspect "$FRONT_CONTAINER_ID" --format '{{.Config.Image}}')

              if [ "$API_IMAGE" != "stone881129/sdl-api:${NEW_TAG}" ]; then
                echo "❌ $service_name API 映像版本不符: $API_IMAGE"
                exit 1
              fi

              if [ "$FRONT_IMAGE" != "stone881129/sdl-front:${NEW_TAG}" ]; then
                echo "❌ $service_name Frontend 映像版本不符: $FRONT_IMAGE"
                exit 1
              fi

              PG_USER=$(grep '^PG_USER=' .env | cut -d= -f2-)
              PG_PASSWORD=$(grep '^PG_PASSWORD=' .env | cut -d= -f2-)
              PG_NAME=$(grep '^PG_NAME=' .env | cut -d= -f2-)
              ESCAPED_PG_PASSWORD=$(printf "%s" "$PG_PASSWORD" | sed "s/'/''/g")

              verify_public_db() {
                if command -v psql > /dev/null 2>&1; then
                  PGPASSWORD="$PG_PASSWORD" \
                    psql -h 127.0.0.1 -p 15432 -U "$PG_USER" -d "$PG_NAME" -c "SELECT 1;" > /dev/null
                else
                  docker run --rm --network host \
                    -e PGPASSWORD="$PG_PASSWORD" \
                    postgres:17 \
                    psql -h 127.0.0.1 -p 15432 -U "$PG_USER" -d "$PG_NAME" -c "SELECT 1;" > /dev/null
                fi
              }

              if ! verify_public_db; then
                echo "⚠️ $service_name PostgreSQL 對外映射埠 15432 密碼驗證失敗，嘗試以 .env 同步角色密碼"

                docker exec -u postgres "$POSTGRES_CONTAINER_ID" \
                  psql -U postgres -d postgres -c "ALTER ROLE \"$PG_USER\" WITH PASSWORD '$ESCAPED_PG_PASSWORD';" > /dev/null || {
                  echo "❌ $service_name 無法同步 PostgreSQL 角色密碼"
                  docker compose -f "$compose_file" logs --tail=80 postgres
                  exit 1
                }

                if ! verify_public_db; then
                  echo "❌ $service_name PostgreSQL 對外映射埠 15432 密碼驗證仍然失敗"
                  docker compose -f "$compose_file" logs --tail=120 postgres
                  exit 1
                fi

                echo "✅ $service_name PostgreSQL 角色密碼已同步並驗證成功"
              fi

              echo "✅ $service_name 映像版本與 PostgreSQL 對外連線驗證皆正確"
            done
