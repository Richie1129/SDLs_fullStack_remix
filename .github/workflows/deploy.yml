name: Deploy to Production

on:
  push:
    branches:
      - deploy
      - rwd-layout-test
      - rwd-layout-clean
env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: 🏗️ Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./sdl-backend-main
          dockerfile: ./sdl-backend-main/Dockerfile.prod
          push: true
          tags: stone881129/sdl-api:sdls-v3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🎨 Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./sdl-frontend-main
          dockerfile: ./sdl-frontend-main/Dockerfile.prod
          push: true
          tags: stone881129/sdl-front:sdls-v3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 300s  # ✅ 修正：時間需加單位
          script: |
            cd /home/hsueh/SDLs_fullStack_remix_v3 || { echo "❌ 專案目錄不存在"; exit 1; }

            if [ -f .env ]; then
              cp .env .env.backup
              echo "✅ 已備份 .env 檔案"
            fi

            echo "📦 拉取最新映像檔..."
            docker pull stone881129/sdl-api:sdls-v3
            docker pull stone881129/sdl-front:sdls-v3

            echo "🛑 停止舊服務..."
            docker-compose -f docker-compose.v3.yml down || true

            echo "🧹 清理舊映像檔..."
            docker image prune -f

            echo "🚀 啟動新服務..."
            docker-compose -f docker-compose.v3.yml up -d

            echo "⏳ 等待服務啟動..."
            sleep 30

            echo "🧬 執行 Sequelize migration..."
            docker-compose -f docker-compose.v3.yml exec -T api npx sequelize-cli db:migrate || { echo '❌ Migration 失敗'; exit 1; }

            echo "🪵 顯示最近容器 logs..."
            docker-compose logs --tail=50

            echo "🎉 部署完成！"

      - name: 🎯 Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          command_timeout: 180s
          script: |
            cd /home/hsueh/SDLs_fullStack_remix_v3

            echo "📊 最終容器狀態檢查..."
            docker-compose -f docker-compose.v3.yml ps

            echo "🔍 檢查是否所有容器皆為 Up 或 Up (healthy)..."
            INVALID=$(docker-compose -f docker-compose.v3.yml ps | awk 'NR>1 && $0 !~ /Up/ {print $1, $5}')

            if [ -n "$INVALID" ]; then
              echo "❌ 以下容器未正常運行："
              echo "$INVALID"
              docker-compose -f docker-compose.v3.yml logs --tail=100
              exit 1
            else
              echo "✅ 所有容器皆正常運行"
            fi