name: Deploy to Production

on:
  push:
    branches:
      - rwd-layout-clean

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: 🏗️ Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./sdl-backend-main
          file: ./sdl-backend-main/Dockerfile.prod
          push: true
          tags: stone881129/sdl-api:sdls-v3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🎨 Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./sdl-frontend-main
          file: ./sdl-frontend-main/Dockerfile.prod
          push: true
          tags: stone881129/sdl-front:sdls-v3
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          command_timeout: 900s
          timeout: 1200s
          script: |
            set -euo pipefail

            DOCKER_USER="${{ env.DOCKER_USERNAME }}"
            DOCKER_PASS="${{ env.DOCKER_TOKEN }}"

            echo "🔐 Docker Hub login on server..."
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

            DEPLOY_TARGETS=(
              "/home/hsueh/SDLs_fullStack_remix_v3|docker-compose.v3.yml|main"
              "/home/hsueh/SDLs_fullStack_remix_v3_lazyinwork|docker-compose.yml|lazyinwork"
            )

            retry() {
              local n=0
              local max=3
              local delay=5
              while true; do
                "$@" && break || {
                  n=$((n+1))
                  if [ $n -ge $max ]; then
                    echo "❌ Command failed after $n attempts: $*"
                    return 1
                  else
                    echo "⏳ Retry $n/$max after ${delay}s: $*"
                    sleep $delay
                    delay=$((delay*2))
                  fi
                }
              done
            }

            for target in "${DEPLOY_TARGETS[@]}"; do
              IFS='|' read -r deploy_dir compose_file service_name <<< "$target"
              echo "🎯 部署 $service_name 到 $deploy_dir"
              cd "$deploy_dir" || { echo "❌ 目錄不存在: $deploy_dir"; exit 1; }

              # 備份 .env
              if [ -f .env ]; then
                cp .env .env.backup
                echo "✅ 已備份 .env"
              fi

              echo "📦 拉取服務所需映像檔 (docker-compose pull)..."
              retry docker-compose -f "$compose_file" pull

              echo "🛑 停止 $service_name 舊服務..."
              docker-compose -f "$compose_file" down || true

              echo "🚀 啟動 $service_name 新服務..."
              retry docker-compose -f "$compose_file" up -d

              echo "⏳ 等待服務穩定..."
              sleep 20

              # 若存在 api 服務才執行 migration
              if docker-compose -f "$compose_file" ps | awk 'NR>1 {print $1}' | grep -q "_api_"; then
                echo "🧬 執行 Sequelize migration..."
                retry docker-compose -f "$compose_file" exec -T api npx sequelize-cli db:migrate
              else
                echo "ℹ️ 找不到 api 服務，略過 migration"
              fi

              echo "✅ $service_name 部署完成"
            done

            echo "🧹 清理 dangling images..."
            docker image prune -f

      - name: 🎯 Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          command_timeout: 600s
          timeout: 900s
          script: |
            set -euo pipefail

            VERIFY_TARGETS=(
              "/home/hsueh/SDLs_fullStack_remix_v3|docker-compose.v3.yml|main"
              "/home/hsueh/SDLs_fullStack_remix_v3_lazyinwork|docker-compose.yml|lazyinwork"
            )

            for target in "${VERIFY_TARGETS[@]}"; do
              IFS='|' read -r deploy_dir compose_file service_name <<< "$target"

              echo "🔍 驗證 $service_name ..."
              cd "$deploy_dir" || { echo "❌ 無法進入 $deploy_dir"; exit 1; }

              docker-compose -f "$compose_file" ps

              INVALID=$(docker-compose -f "$compose_file" ps | awk 'NR>1 && $0 !~ /Up/ {print $1, $5}')
              if [ -n "$INVALID" ]; then
                echo "❌ 未正常運行容器："
                echo "$INVALID"
                docker-compose -f "$compose_file" logs --tail=120
                exit 1
              fi

              echo "✅ $service_name OK"
            done
