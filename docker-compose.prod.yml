services:
  nginx:
    image: nginx
    restart: always
    # Docker json-file log 輪替：避免 SQL/HTTP 日誌無上限成長吃滿磁碟
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - 80:80    
      - 443:443
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf"
      - "./letsencrypt:/etc/letsencrypt"
      - "./www:/var/www/html"
    depends_on:
      - api
      - front
    networks:
      - agent_network

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - "./letsencrypt:/etc/letsencrypt"
      - "./www:/var/www/html"
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - agent_network

  api:
    build:
      context: ./sdl-backend-main
      dockerfile: Dockerfile.prod
    image: stone881129/sdl-api:latest
    restart: always
    # Docker json-file log 輪替：避免 SQL/HTTP 日誌無上限成長吃滿磁碟
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - 3000
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_NAME=${PG_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2}
      # MinIO 環境變數
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-sdl-files}
      # CORS 允許的 origins
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    volumes:
      - "./sdl-backend-main/daily_file:/sdl-backend-main/daily_file"
    networks:
      - agent_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  front:
    build:
      context: ./sdl-frontend-main
      dockerfile: Dockerfile.prod
    image: stone881129/sdl-front:latest
    restart: always
    expose:
      - 5173
    networks:
      - agent_network

  postgres:
    image: postgres:17
    restart: always
    # 15 GB / 6 核主機的記憶體參數（原本全是映像預設值：shared_buffers 128MB）
    # 詳見 docs/reports/PERFORMANCE_REVIEW_2026-09-02.md 第 2.1 節與 B12
    command: >
      postgres
      -c shared_buffers=3GB
      -c effective_cache_size=9GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c max_connections=100
      -c random_page_cost=1.1
    # 平行查詢的動態共享記憶體走 /dev/shm，Docker 預設 64MB 太小
    shm_size: 1gb
    # Docker json-file log 輪替：避免 SQL/HTTP 日誌無上限成長吃滿磁碟
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - POSTGRES_DB=${PG_NAME}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    expose:
      - 5432
    networks:
      - agent_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    expose:
      - "9000"
      - "9001"
    networks:
      - agent_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-sdl-files}
    networks:
      - agent_network
    entrypoint: >
      /bin/sh -c "
      echo '初始化 MinIO...';
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      if /usr/bin/mc ls myminio/$$MINIO_BUCKET_NAME > /dev/null 2>&1; then
        echo '✅ Bucket 已存在: $$MINIO_BUCKET_NAME';
      else
        echo '📦 創建 bucket: $$MINIO_BUCKET_NAME';
        /usr/bin/mc mb myminio/$$MINIO_BUCKET_NAME;
        echo '✅ Bucket 創建成功';
      fi;
      echo '🎉 MinIO 初始化完成！';
      "

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_CONFIG_CONSOLE_LOG_LEVEL=40
      - GUNICORN_ACCESS_LOGFILE=/dev/null
    expose:
      - "80"
    networks:
      - agent_network
networks:
  agent_network:

volumes:
  postgres_data: 
  minio_data: 