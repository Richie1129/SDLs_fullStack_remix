services:
  nginx:
    image: nginx
    restart: always
    ports:
      - 80:80    
      - 443:443
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf"
      - "./letsencrypt:/etc/letsencrypt"
      - "./www:/var/www/html"
    depends_on:
      - api
      - front
    networks:
      - agent_network

  certbot:
    image: certbot/certbot
    restart: always
    volumes:
      - "./letsencrypt:/etc/letsencrypt"
      - "./www:/var/www/html"
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - agent_network

  api:
    build:
      context: ./sdl-backend-main
      dockerfile: Dockerfile.prod
    image: stone881129/sdl-api:latest
    restart: always
    expose:
      - 3000
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=postgres
      - PG_NAME=sdls_fullstack_postgres1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # MinIO 環境變數
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-sdl-files}
    volumes:
      - "./sdl-backend-main/daily_file:/sdl-backend-main/daily_file"
    networks:
      - agent_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  front:
    build:
      context: ./sdl-frontend-main
      dockerfile: Dockerfile.prod
    image: stone881129/sdl-front:latest
    restart: always
    expose:
      - 5173
    networks:
      - agent_network

  postgres:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    expose:
      - 5432
    networks:
      - agent_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - agent_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-sdl-files}
    networks:
      - agent_network
    entrypoint: >
      /bin/sh -c "
      echo '🚀 初始化 MinIO...';
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      if /usr/bin/mc ls myminio/$$MINIO_BUCKET_NAME > /dev/null 2>&1; then
        echo '✅ Bucket 已存在: $$MINIO_BUCKET_NAME';
      else
        echo '📦 創建 bucket: $$MINIO_BUCKET_NAME';
        /usr/bin/mc mb myminio/$$MINIO_BUCKET_NAME;
        echo '✅ Bucket 創建成功';
      fi;
      echo '🎉 MinIO 初始化完成！';
      "

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=wulab@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=ytwu35415
      - PGADMIN_CONFIG_CONSOLE_LOG_LEVEL=40
      - GUNICORN_ACCESS_LOGFILE=/dev/null
    ports:
      - "5555:80"
    networks:
      - agent_network
networks:
  agent_network:

volumes:
  postgres_data: 
  minio_data: 